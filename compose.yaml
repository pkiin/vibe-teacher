name: vibe-teacher-memory
services:
  memory-db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    ports:
      - "127.0.0.1:${VIBE_TEACHER_POSTGRES_PORT:-55432}:5432"
    environment:
      POSTGRES_DB: vibe_teacher_memory
      POSTGRES_USER: vibe_teacher
      POSTGRES_PASSWORD: ${VIBE_TEACHER_POSTGRES_PASSWORD:?Run npm run memory:db first}
    volumes:
      - memory-data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibe_teacher -d vibe_teacher_memory"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  memory-data:
